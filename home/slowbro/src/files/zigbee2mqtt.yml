version: 5
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://localhost:1883
  user: zigbee2mqtt
  password: $MOSQUITTO_ZIGBEE2MQTT_PASSWORD
serial:
  adapter: zstack
  port: /dev/ttyACM0
advanced:
  log_level: info
  log_output:
    - console
  enable_external_js: false
  elapsed: true
  last_seen: ISO_8601
frontend:
  enabled: true
  port: 8080
homeassistant:
  enabled: false
onboarding: false
device_options:
    retain: true
devices:
  '0xa4c138ee43bc62da':
    friendly_name: climate/main bedroom 0
    humidity_calibration: 4
